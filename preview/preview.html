<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI Picker preview</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
  }
  html.zoomed body {
    overflow: auto;
  }
  body.bg-dots {
    background: radial-gradient(var(--canvas-dot) 1px, transparent 1.5px) 0 0 / 16px 16px, var(--canvas);
  }
  body.bg-light {
    background: var(--canvas-light);
  }
  body.bg-dark {
    background: var(--canvas-dark);
  }
  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  ::-webkit-scrollbar-track,
  ::-webkit-scrollbar-corner {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--muted-foreground) 45%, transparent) padding-box;
    border: 3px solid transparent;
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: color-mix(in srgb, var(--muted-foreground) 70%, transparent);
  }
  #stage {
    flex: none;
    margin: auto;
    position: relative;
    overflow: hidden;
  }
  #frame {
    /* Must match the copied page's default scheme, or Chrome paints an opaque backdrop behind it. */
    color-scheme: light;
    position: absolute;
    left: 0;
    top: 0;
    border: 0;
    display: block;
    background: transparent;
    transform-origin: 0 0;
  }
</style>
</head>
<body class="bg-dots">
<div id="stage"><iframe id="frame" sandbox="allow-same-origin" title="Component"></iframe></div>
<script src="../shared/util.js"></script>
<script src="../shared/storage.js"></script>
<script src="../shared/theme.js"></script>
<script src="../shared/settings.js"></script>
<script src="../content/tokens.js"></script>
<script src="preview.js"></script>
</body>
</html>
